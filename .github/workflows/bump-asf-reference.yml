# This action bumps the ArchiSteamFarm submodule to the latest stable release: both the reference in .gitmodules and the
# commit the submodule points at, so the plugin is built against the release that the trimmed-ASF check downloads
# It builds and tests the plugin against the new release first and pushes nothing when that fails, so a release that
# needs corrections in the plugin leaves main as it was and shows up as a failed run instead
# Note: If you'd like to change the default channel from stable to pre-releases, simply change RELEASE_TYPE
name: Plugin-bump-asf-reference

on:
  schedule:
  - cron: '17 1 * * *'

  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0
  # You can specify your own credentials if you'd like to, simply change ARCHIBOT_GPG_PRIVATE_KEY and/or ARCHIBOT_GITHUB_TOKEN secrets here to the ones you want to use
  GPG_PRIVATE_KEY: ${{ secrets.ARCHIBOT_GPG_PRIVATE_KEY }} # Optional, if secret not provided, will skip signing commit with GPG key
  PUSH_GITHUB_TOKEN: ${{ secrets.ARCHIBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }} # Optional, if secret not provided, will use the default token
  RELEASE_TYPE: stable # Recommended to choose one from: stable (latest ASF stable release), nodraft (latest ASF release, including pre-releases, but without drafts)

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        token: ${{ env.PUSH_GITHUB_TOKEN }}

    - name: Fetch latest ArchiSteamFarm release
      id: asf-release
      uses: rez0n/actions-github-release@05fabbd6b2b3ce3383299555ea518faea69b736d # v2.1
      env:
        repository: JustArchiNET/ArchiSteamFarm
        token: ${{ secrets.GITHUB_TOKEN }}
        type: ${{ env.RELEASE_TYPE }}

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Import GPG key for signing
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      if: ${{ env.GPG_PRIVATE_KEY != null }}
      with:
        gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Update ASF reference if needed
      env:
        LATEST_ASF_RELEASE: ${{ steps.asf-release.outputs.release }}
      shell: sh
      run: |
        set -eu

        current_version="$(git config -f .gitmodules submodule.ArchiSteamFarm.branch)"

        if dpkg --compare-versions "$current_version" "ge" "$LATEST_ASF_RELEASE"; then
            exit
        fi

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git config -f .gitmodules submodule.ArchiSteamFarm.branch "$LATEST_ASF_RELEASE"

        # Point the submodule at the release tag too; a shallow fetch of that one tag is enough to build
        git submodule update --init --depth 1 ArchiSteamFarm
        git -C ArchiSteamFarm fetch --depth 1 origin "refs/tags/${LATEST_ASF_RELEASE}:refs/tags/${LATEST_ASF_RELEASE}"
        git -C ArchiSteamFarm checkout -q "$LATEST_ASF_RELEASE"

        # Push nothing that does not build and pass the tests against the new release
        dotnet build -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo
        dotnet test ASFPluginConfig.Tests -c Release --no-build --nologo

        git add -A ".gitmodules" ArchiSteamFarm

        if ! git config --get user.email > /dev/null; then
            git config --local user.email "action@github.com"
        fi

        if ! git config --get user.name > /dev/null; then
            git config --local user.name "GitHub Action"
        fi

        git commit -m "Automatic ArchiSteamFarm reference update to ${LATEST_ASF_RELEASE}"

        git push
