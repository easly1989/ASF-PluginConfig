<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Plugin config</title>
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<main>
		<h1 tabindex="-1">Plugin config</h1>
		<p id="banner" class="warning" hidden></p>
		<form id="login" hidden>
			<label for="password">IPC password</label>
			<input id="password" type="password" autocomplete="current-password" required>
			<button type="submit">Unlock</button>
		</form>
		<p id="status" role="status" aria-live="polite">Loading…</p>
		<ul id="plugins" aria-label="Plugins" hidden></ul>
		<section id="updates" aria-labelledby="updates-title" hidden>
			<h2 id="updates-title">Plugin updates</h2>
			<p class="hint">ASF looks for updates of the plugins that PluginsUpdateMode and PluginsUpdateList in ASF.json allow, installs them, and restarts if anything was updated.</p>
			<button type="button" id="update">Update plugins</button>
			<p id="update-result" class="result" role="status"></p>
		</section>
	</main>
	<script src="form.js"></script>
	<script src="app.js"></script>
</body>
</html>
