<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Plugin config</title>
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<main>
		<header class="top">
			<svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
				<rect width="32" height="32" rx="8"/>
				<path d="M8 11h9M21 11h3M8 21h3M15 21h9" />
				<circle cx="19" cy="11" r="2.5"/>
				<circle cx="13" cy="21" r="2.5"/>
			</svg>
			<h1 tabindex="-1">Plugin config</h1>
			<ul class="pills" aria-label="Host">
				<li id="version" class="pill" hidden></li>
				<li id="saving" class="pill" hidden></li>
			</ul>
		</header>
		<p id="banner" class="warning" hidden></p>
		<form id="login" hidden>
			<label for="password">IPC password</label>
			<div class="row">
				<input id="password" type="password" autocomplete="current-password" required>
				<button type="submit">Unlock</button>
			</div>
		</form>
		<p id="status" role="status" aria-live="polite">Loading…</p>
		<div class="layout">
			<nav id="rail" aria-label="Sections" hidden><ul></ul></nav>
			<div class="content">
				<ul id="plugins" aria-label="Plugins" hidden></ul>
				<section id="updates" aria-labelledby="updates-title" hidden>
					<h2 id="updates-title">Plugin updates</h2>
					<p class="hint" id="update-hint"></p>
					<button type="button" class="secondary" id="update" aria-describedby="update-hint">Update plugins</button>
					<p id="update-result" class="result" role="status"></p>
				</section>
			</div>
		</div>
	</main>
	<script src="form.js"></script>
	<script src="app.js"></script>
</body>
</html>
